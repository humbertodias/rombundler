name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_call:
    inputs:
      publish_release:
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            artifact: linux-x86_64
            runner: ubuntu-24.04
            extra: ""
            timeout: 30
            docker_platforms: linux/amd64
          - platform: linux
            artifact: linux-aarch64
            runner: ubuntu-24.04-arm
            extra: ""
            timeout: 30
            docker_platforms: linux/arm64
          - platform: windows
            artifact: windows-x86_64
            runner: ubuntu-24.04
            extra: ""
            timeout: 45
            docker_platforms: linux/amd64
          - platform: macos
            artifact: macos-x86_64
            runner: ubuntu-24.04
            extra: x86_64
            timeout: 180
            docker_platforms: linux/amd64
          - platform: macos
            artifact: macos-arm64
            runner: ubuntu-24.04
            extra: arm64
            timeout: 180
            docker_platforms: linux/amd64
          - platform: switch
            artifact: switch-aarch64
            runner: ubuntu-24.04
            extra: ""
            timeout: 45
            docker_platforms: linux/amd64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Load versions
        run: grep -vE '^\s*(#|$)' versions.env >> "$GITHUB_ENV"

      - name: Version from tag
        if: ${{ github.event_name == 'release' || inputs.publish_release }}
        run: echo "VERSION=$(echo '${{ github.event.release.tag_name }}' | sed 's/^v//')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build toolchain image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.${{ matrix.platform }}
          tags: rombundler-${{ matrix.platform }}
          load: true
          provenance: false
          platforms: ${{ matrix.docker_platforms }}
          build-args: |
            MACOSX_SDK=${{ env.MACOSX_SDK }}
            MACOSX_SDK_SHA256=${{ env.MACOSX_SDK_SHA256 }}
            OSX_VERSION_MIN=${{ env.OSXCROSS_OSX_VERSION_MIN }}
          cache-from: type=gha,scope=rombundler-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=rombundler-${{ matrix.platform }}

      - name: Build
        env:
          SKIP_DOCKER_BUILD: "1"
        run: bash build.sh ${{ matrix.platform }} ${{ matrix.extra }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ROMBundler-${{ matrix.artifact }}
          path: dist/ROMBundler-*/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release Asset
        if: ${{ inputs.publish_release }}
        uses: alexellis/upload-assets@0.4.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          asset_paths: '["./dist/ROMBundler-*.zip"]'
