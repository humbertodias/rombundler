name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            artifact: linux-x86_64
            runner: ubuntu-24.04
            extra: ""
            timeout: 30
          - platform: linux
            artifact: linux-aarch64
            runner: ubuntu-24.04-arm
            extra: ""
            timeout: 30
          - platform: windows
            artifact: windows-x86_64
            runner: ubuntu-24.04
            extra: ""
            timeout: 45
          - platform: macos
            artifact: macos-x86_64
            runner: ubuntu-24.04
            extra: x86_64
            timeout: 180
          - platform: macos
            artifact: macos-arm64
            runner: ubuntu-24.04
            extra: arm64
            timeout: 180

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Load versions
        run: grep -vE '^\s*(#|$)' versions.env >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build toolchain image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.${{ matrix.platform }}
          tags: rombundler-${{ matrix.platform }}
          load: true
          provenance: false
          build-args: |
            MACOSX_SDK=${{ env.MACOSX_SDK }}
            MACOSX_SDK_SHA256=${{ env.MACOSX_SDK_SHA256 }}
            OSX_VERSION_MIN=${{ env.OSXCROSS_OSX_VERSION_MIN }}
          cache-from: type=gha,scope=rombundler-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=rombundler-${{ matrix.platform }}

      - name: Build
        env:
          SKIP_DOCKER_BUILD: "1"
        run: bash scripts/build.sh ${{ matrix.platform }} ${{ matrix.extra }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ROMBundler-${{ matrix.artifact }}
          path: dist/ROMBundler-*.zip
          if-no-files-found: error
          retention-days: 14
