name: CD

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      core:
        description: "Libretro core (dummy = color bars; all = every name in cores.env)"
        type: choice
        required: true
        default: dummy
        options:
          - dummy
          - all
          - 2048
          - 3dengine
          - 81
          - a5200
          - anarch
          - ardens
          - arduous
          - armajet
          - atari2600
          - atari7800
          - atari800
          - beetle_bsnes
          - beetle_cygne
          - beetle_gba
          - beetle_lynx
          - beetle_neopop
          - beetle_pce
          - beetle_pce_fast
          - beetle_pcfx
          - beetle_psx
          - beetle_psx_hw
          - beetle_saturn
          - beetle_supergrafx
          - beetle_vb
          - bk
          - blastem
          - bluemsx
          - boom3
          - bsnes2014
          - bsnes_hd_beta
          - cannonball
          - cap32
          - chailove
          - clownmdemu
          - clv
          - craft
          - dosbox
          - dosbox_pure
          - dosbox_svn
          - duckstation
          - easyrpg
          - fceumm
          - flycast
          - freeintv
          - fusion
          - gambatte
          - genesis
          - genesis_plus_gx
          - gpsp
          - gw
          - hatari
          - jaguar
          - lr_dosbox
          - lua
          - mame
          - mame2000
          - mame2003
          - mame2003_plus
          - mame2010
          - mame2015
          - mame2016
          - melonds
          - mess
          - metal_slg
          - mgba
          - moonlight
          - mupen64plus
          - neocdex
          - nestopia
          - np2kai
          - nxengine
          - o2em
          - openlara
          - opera
          - parallel_n64
          - pcsx2
          - pcsx_rearmed
          - picodrive
          - play
          - pocketcdg
          - pokemini
          - ppsspp
          - prboom
          - prosystem
          - puae
          - px68k
          - quasi88
          - quicknes
          - reminiscence
          - remotejoy
          - sameboy
          - scummvm
          - snes9x
          - snes9x2002
          - snes9x2005
          - snes9x2005_plus
          - snes9x2010
          - stella
          - superfamicast
          - supermodel
          - tgbdual
          - theodore
          - vice
          - virtualjaguar
          - vitaquake2
          - vitaquake3
          - wasm4
          - wolf3d
          - x1
          - x68000

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan cores
    runs-on: ubuntu-24.04
    outputs:
      cores: ${{ steps.set.outputs.cores }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        name: Resolve core matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          CORE_INPUT: ${{ inputs.core || 'dummy' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" || "$CORE_INPUT" == "dummy" ]]; then
            echo 'cores=["dummy"]' >> "$GITHUB_OUTPUT"
          elif [[ "$CORE_INPUT" == "all" ]]; then
            {
              printf 'cores=['
              first=1
              while IFS= read -r line || [[ -n "$line" ]]; do
                [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
                [[ "$line" != *=* ]] && continue
                key="${line%%=*}"
                key="$(printf '%s' "$key" | tr '[:upper:]' '[:lower:]')"
                [[ -z "$key" ]] && continue
                if [[ "$first" -eq 1 ]]; then
                  first=0
                else
                  printf ','
                fi
                printf '"%s"' "$key"
              done < cores.env
              printf ']\n'
            } >> "$GITHUB_OUTPUT"
          else
            printf 'cores=["%s"]\n' "$CORE_INPUT" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        core: ${{ fromJson(needs.plan.outputs.cores) }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: write
    with:
      publish_release: ${{ github.event_name == 'release' }}
      core: ${{ matrix.core == 'dummy' && '' || matrix.core }}
    secrets: inherit
