name: Cores

# Build static libretro archives inside each port image.
# The wasm job also links that archive into a droppable side-module .wasm.
# workflow_dispatch: pick dummy (skip), all, or a name from cores.env.

on:
  workflow_dispatch:
    inputs:
      core:
        description: "Libretro core (dummy = skip; all = every name in cores.env)"
        type: choice
        required: true
        default: dummy
        options:
          - dummy
          - all
          - 2048
          - 3dengine
          - 81
          - a5200
          - anarch
          - ardens
          - arduous
          - armajet
          - atari2600
          - atari7800
          - atari800
          - beetle_bsnes
          - beetle_cygne
          - beetle_gba
          - beetle_lynx
          - beetle_neopop
          - beetle_pce
          - beetle_pce_fast
          - beetle_pcfx
          - beetle_psx
          - beetle_psx_hw
          - beetle_saturn
          - beetle_supergrafx
          - beetle_vb
          - bk
          - blastem
          - bluemsx
          - boom3
          - bsnes2014
          - bsnes_hd_beta
          - cannonball
          - cap32
          - chailove
          - clownmdemu
          - clv
          - craft
          - dosbox
          - dosbox_pure
          - dosbox_svn
          - duckstation
          - easyrpg
          - fceumm
          - flycast
          - freeintv
          - fusion
          - gambatte
          - genesis
          - genesis_plus_gx
          - gpsp
          - gw
          - hatari
          - jaguar
          - lr_dosbox
          - lua
          - mame
          - mame2000
          - mame2003
          - mame2003_plus
          - mame2010
          - mame2015
          - mame2016
          - melonds
          - mess
          - metal_slg
          - mgba
          - moonlight
          - mupen64plus
          - neocdex
          - nestopia
          - np2kai
          - nxengine
          - o2em
          - openlara
          - opera
          - parallel_n64
          - pcsx2
          - pcsx_rearmed
          - picodrive
          - play
          - pocketcdg
          - pokemini
          - ppsspp
          - prboom
          - prosystem
          - puae
          - px68k
          - quasi88
          - quicknes
          - reminiscence
          - remotejoy
          - sameboy
          - scummvm
          - snes9x
          - snes9x2002
          - snes9x2005
          - snes9x2005_plus
          - snes9x2010
          - stella
          - superfamicast
          - supermodel
          - tgbdual
          - theodore
          - vice
          - virtualjaguar
          - vitaquake2
          - vitaquake3
          - wasm4
          - wolf3d
          - x1
          - x68000
  push:
    branches: [master, main]
    paths:
      - cores.sh
      - cores.env
      - docker/Dockerfile.switch
      - docker/Dockerfile.vita
      - docker/Dockerfile.wasm
      - .github/workflows/cores.yml

concurrency:
  group: cores-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan cores
    runs-on: ubuntu-24.04
    outputs:
      cores: ${{ steps.set.outputs.cores }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        name: Resolve core matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          CORE_INPUT: ${{ inputs.core || 'dummy' }}
        run: |
          set -euo pipefail
          # Push smoke: one known core. Dispatch: choice (dummy → empty).
          if [[ "$EVENT_NAME" == "push" ]]; then
            echo 'cores=["genesis_plus_gx"]' >> "$GITHUB_OUTPUT"
          elif [[ "$CORE_INPUT" == "dummy" ]]; then
            echo 'cores=[]' >> "$GITHUB_OUTPUT"
          elif [[ "$CORE_INPUT" == "all" ]]; then
            {
              printf 'cores=['
              first=1
              while IFS= read -r line || [[ -n "$line" ]]; do
                [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
                [[ "$line" != *=* ]] && continue
                key="${line%%=*}"
                key="$(printf '%s' "$key" | tr '[:upper:]' '[:lower:]')"
                [[ -z "$key" ]] && continue
                if [[ "$first" -eq 1 ]]; then
                  first=0
                else
                  printf ','
                fi
                printf '"%s"' "$key"
              done < cores.env
              printf ']\n'
            } >> "$GITHUB_OUTPUT"
          else
            printf 'cores=["%s"]\n' "$CORE_INPUT" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.port }} - ${{ matrix.core }}
    needs: plan
    if: needs.plan.outputs.cores != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        port: [switch, vita, wasm]
        core: ${{ fromJson(needs.plan.outputs.cores) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build toolchain image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.${{ matrix.port }}
          tags: rombundler-${{ matrix.port }}
          load: true
          provenance: false
          platforms: linux/amd64
          cache-from: type=gha,scope=rombundler-${{ matrix.port }}
          cache-to: type=gha,mode=max,scope=rombundler-${{ matrix.port }}

      - name: Build core
        env:
          SKIP_DOCKER_BUILD: "1"
        run: bash cores.sh ${{ matrix.port }} '${{ matrix.core }}'

      - name: Link WASM side module
        if: matrix.port == 'wasm'
        env:
          SKIP_DOCKER_BUILD: "1"
        run: |
          set -euo pipefail
          shopt -s nullglob
          arts=(cores/wasm/*.a cores/wasm/*.bc)
          if [[ ${#arts[@]} -eq 0 ]]; then
            echo "no archive under cores/wasm/" >&2
            exit 1
          fi
          for art in "${arts[@]}"; do
            bash build.sh wasm --side-module "${art}"
          done
          ls -lh dist/*.wasm

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.port }}-${{ matrix.core }}
          path: |
            cores/${{ matrix.port }}/*.a
            cores/${{ matrix.port }}/*.bc
          if-no-files-found: error
          retention-days: 14

      - name: Upload WASM side module
        if: matrix.port == 'wasm'
        uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.core }}
          path: dist/*.wasm
          if-no-files-found: error
          retention-days: 14
